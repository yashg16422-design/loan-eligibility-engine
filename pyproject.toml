[project]
name = "loan-eligibility-engine"
version = "0.1.0"
description = "Event-driven CSV ingestion + n8n loan matching on AWS"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W/F: errors, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simplifications, N: naming, ANN: type hints required, RUF: ruff extras.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ANN", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests don't need return-type annotations on every test function.
"tests/**" = ["ANN"]
# The workflow generator embeds SQL/JS/Markdown verbatim (long lines are content, not
# code) and its tiny node builder forwards arbitrary n8n node settings via **extra.
"n8n/build_workflows.py" = ["E501", "ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
files = ["loan_engine"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# boto3/botocore ship no type information (the separate boto3-stubs package is large and only
# adds client types we do not rely on); everything else is checked.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
