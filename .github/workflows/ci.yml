# CI: everything that can be checked without AWS runs on every push and pull request.
#   lint (ruff) -> JS unit tests (the n8n Code-node logic) -> Python unit + integration tests
#   against a real PostgreSQL 17 with TLS (like RDS) -> the committed n8n workflow JSON must
#   be exactly what n8n/build_workflows.py generates (no hand edits drift from the source).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PG_TEST_PORT: "55432"
      PG_TEST_PASSWORD: localtest  # throwaway CI container, not a real credential
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Started first so it is ready by the time the tests run. Service containers cannot
      # take server flags, so plain docker run: TLS on, because the app enforces sslmode=require.
      - name: Start PostgreSQL 17 (TLS on, like RDS)
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD="$PG_TEST_PASSWORD" -e POSTGRES_DB=app \
            -p "$PG_TEST_PORT:5432" postgres:17 -c ssl=on \
            -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem \
            -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy, loan_engine)
        run: mypy

      - name: Funnel figure matches the evidence file
        run: python scripts/funnel_svg.py --check

      - name: JS unit tests (n8n Code-node logic)
        run: node --test n8n/code/code.test.js

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres -d app && exit 0
            sleep 2
          done
          docker logs pg; exit 1

      - name: Python unit + integration tests, with coverage
        # -rs lists skipped tests: with PG_TEST_PORT set, the DB tests must run, not skip.
        # Coverage of loan_engine was 92% when the gate was added; it may only go up.
        run: pytest -rs --cov=loan_engine --cov-report=term-missing:skip-covered --cov-fail-under=90

      - name: Golden master + matching on the streaming ingest path
        # The ingest tests run on both paths already (parametrized); this re-runs the golden
        # fingerprint and the matching suite with INGEST_STREAMING on, as deployed.
        env:
          INGEST_STREAMING: "true"
        run: pytest -q tests/integration/test_golden.py tests/integration/test_matching_db.py

      - name: Workflow JSON matches the generator
        env:
          DATA_BUCKET: loan-engine-dev-data-434661699719  # bucket name, already in the JSON
          API_URL: https://t7lcgp5o0j.execute-api.ap-southeast-2.amazonaws.com  # public API, in the JSON
        run: |
          python n8n/build_workflows.py
          git diff --exit-code -- n8n/workflows/ \
            || { echo "::error::n8n/workflows/ is out of date: run python n8n/build_workflows.py and commit"; exit 1; }

  dashboard:
    # The borrower dashboard + ops console (dashboard/), served by the api Lambda under /app.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Logic tests (simulator == Workflow B on the live catalog, EMI, fit score)
        run: npm test
      - name: Production build
        run: npx vite build

  web:
    # The ClickPar Match landing page (web/): lint, typecheck, copy-vs-mock tests, build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Logic tests (EMI, fit score, pipeline layout, every quoted number vs the mocks)
        run: npm test
      - name: Production build
        run: npx vite build
