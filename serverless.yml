# Loan Eligibility Engine: every AWS resource lives in this one file (PLAN.md §2).
# Deploy order follows PLAN.md §20: network → RDS → S3/SQS → Lambdas → EC2.
service: loan-engine
frameworkVersion: "4"

provider:
  name: aws
  region: ap-southeast-2 # the only region this account's SCP allows (PLAN.md §23)
  stage: ${opt:stage, 'dev'}
  runtime: python3.12
  architecture: arm64 # matches the Apple Silicon dev machine, so wheels build natively (PLAN.md §23)
  logRetentionInDays: 14
  tags:
    project: loan-eligibility-engine
  httpApi:
    authorizers:
      # API Gateway verifies the Cognito ID token (signature, issuer, audience, expiry)
      # before the Lambda runs; /account routes are unreachable without a valid sign-in.
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !Join ["", ["https://cognito-idp.${aws:region}.amazonaws.com/", !Ref UserPool]]
        audience:
          - !Ref UserPoolClient

custom:
  # "Continue with Google" (on; GOOGLE_SIGN_IN=false turns it off). The OAuth client lives in Secrets Manager as
  # loan-engine/<stage>/google-oauth = {"client_id": ..., "client_secret": ...} (README §14).
  googleSignIn: ${env:GOOGLE_SIGN_IN, 'true'}
  # Managed-login domain (OAuth code flow). Google's "Authorized redirect URI" is
  # https://<authDomain>.auth.<region>.amazoncognito.com/oauth2/idpresponse
  authDomain: ${self:service}-${sls:stage}-${aws:accountId}
  # Built as a plain string (not !Ref) to break the bucket <-> queue-policy cycle;
  # the account id makes the name globally unique.
  dataBucket: ${self:service}-${sls:stage}-data-${aws:accountId}
  # Built-in Python packaging (Serverless v4, no plugin). We download prebuilt
  # Linux arm64 wheels, so no Docker is needed (psycopg-binary ships aarch64 wheels).
  pythonRequirements:
    pythonBin: ${env:SLS_PYTHON, '.venv/bin/python'} # a Python 3.12 that has pip
    usePoetry: false # pyproject.toml is tool config only, not a Poetry project
    slim: true
    pipCmdExtraArgs:
      - --platform=manylinux2014_aarch64
      - --platform=manylinux_2_28_aarch64
      - --python-version=3.12
      - "--only-binary=:all:"

# Ship only our code and SQL; requirements are injected by the packager.
package:
  patterns:
    - "!**"
    - loan_engine/**
    - sql/**
    - "!**/__pycache__/**"

functions:
  migrate:
    handler: loan_engine/migrate/handler.handler
    description: Applies sql/ migrations, DB roles and grants. Invoked manually.
    role: MigrateRole
    timeout: 120
    memorySize: 256
    vpc:
      securityGroupIds:
        - !Ref LambdaSG
      subnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    environment:
      DB_HOST: !GetAtt Database.Endpoint.Address
      DB_SSLMODE: verify-full # the RDS CA bundle ships in the package (rollback: require)
      # ARNs only: the Lambda reads the secret values at runtime via the VPC endpoint.
      MASTER_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
      APP_INGEST_SECRET_ARN: !Ref AppIngestDbSecret
      N8N_WORKFLOWS_SECRET_ARN: !Ref N8nWorkflowsDbSecret
      N8N_META_SECRET_ARN: !Ref N8nMetaDbSecret

  ingest:
    handler: loan_engine/ingest/handler.handler
    description: S3 upload (via SQS) -> validate CSV -> load users into RDS -> notify n8n
    role: IngestRole
    timeout: 120 # the queue's visibility timeout (720 s) is 6x this
    # 1024 MB for the CPU share (Lambda's CPU scales with memory); memory use itself is flat
    # with streaming ingest (docs/evidence/ingest_bench_2026-10-11.json).
    memorySize: 1024
    vpc:
      securityGroupIds:
        - !Ref LambdaSG
      subnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    environment:
      DB_HOST: !GetAtt Database.Endpoint.Address
      DB_SSLMODE: verify-full # the RDS CA bundle ships in the package (rollback: require)
      DB_SECRET_ARN: !Ref AppIngestDbSecret
      # Pluggable seams: change behaviour by config, not code.
      VALIDATION_RULES: "" # JSON overrides, e.g. '{"age_min": 21}'; empty = PLAN.md §9 defaults
      # Constant-memory ingest: rows stream from S3 through COPY into Postgres (rollback: "false").
      INGEST_STREAMING: "true"
      # Private network only: Lambda SG -> n8n SG on 5678. If the call fails, Workflow B's
      # 10-minute sweeper still picks the job up (the webhook is an accelerator, not a dependency).
      N8N_WEBHOOK_URL: !Sub http://${N8nInstance.PrivateIp}:5678/webhook/ingest-complete
      N8N_WEBHOOK_SECRET_ARN: !Ref N8nWebhookSecret
      POWERTOOLS_LOG_LEVEL: INFO
    events:
      - sqs:
          arn: !GetAtt IngestQueue.Arn
          batchSize: 1 # one file per invocation: simple, isolated failures
          maximumConcurrency: 2 # the minimum allowed; protects RDS connections

  ingestDlq:
    handler: loan_engine/ingest/dlq.handler
    description: Dead-letter consumer - an upload whose ingest crashed 3 times is marked FAILED
    role: IngestDlqRole
    timeout: 20 # below the DLQ's default 30 s visibility timeout, so the DLQ itself is unchanged
    memorySize: 256
    vpc:
      securityGroupIds:
        - !Ref LambdaSG
      subnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    environment:
      DB_HOST: !GetAtt Database.Endpoint.Address
      DB_SSLMODE: verify-full # the RDS CA bundle ships in the package (rollback: require)
      DB_SECRET_ARN: !Ref AppIngestDbSecret
      POWERTOOLS_LOG_LEVEL: INFO
    events:
      - sqs:
          arn: !GetAtt IngestDLQ.Arn
          batchSize: 1

  api:
    handler: loan_engine/api/handler.handler
    description: Upload UI, presigned POST, job status, borrower dashboard API + app, ops view
    role: ApiRole
    timeout: 10
    memorySize: 256
    vpc:
      securityGroupIds:
        - !Ref LambdaSG
      subnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
    environment:
      DB_HOST: !GetAtt Database.Endpoint.Address
      DB_SSLMODE: verify-full # the RDS CA bundle ships in the package (rollback: require)
      DB_SECRET_ARN: !Ref AppIngestDbSecret
      DATA_BUCKET: ${self:custom.dataBucket}
      TOKEN_SECRET_ARN: !Ref DashboardTokenSecret
      N8N_WEBHOOK_SECRET_ARN: !Ref N8nWebhookSecret # verifies Workflow C's token requests
      USER_POOL_ID: !Ref UserPool
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
      AUTH_DOMAIN: ${self:custom.authDomain}.auth.${aws:region}.amazoncognito.com
      GOOGLE_SIGN_IN: ${self:custom.googleSignIn}
      COMPILE_PROMPT_VERSION: compile_v1 # = COMPILE_PROMPT_VERSION in n8n/build_workflows.py
      VALIDATION_RULES: "" # keep equal to the ingest function's: one set of rules
      POWERTOOLS_LOG_LEVEL: INFO
    events:
      - httpApi: GET /
      - httpApi: GET /upload
      - httpApi: GET /{proxy+} # landing assets; every more specific route wins over it
      # Bulk uploads belong to a signed-in (merchant) account: every /uploads route is behind
      # the Cognito authorizer; ownership is checked in the Lambda.
      - httpApi:
          method: GET
          path: /uploads
          authorizer: { name: cognito }
      - httpApi:
          method: POST
          path: /uploads
          authorizer: { name: cognito }
      - httpApi:
          method: GET
          path: /uploads/{job_id}
          authorizer: { name: cognito }
      - httpApi:
          method: GET
          path: /uploads/{job_id}/emails
          authorizer: { name: cognito }
      - httpApi:
          method: GET
          path: /uploads/{job_id}/analytics
          authorizer: { name: cognito }
      - httpApi: POST /check
      - httpApi: GET /me
      - httpApi: GET /me/matches
      - httpApi: GET /me/preferences
      - httpApi: PUT /me/preferences
      - httpApi: GET /products
      - httpApi: GET /ops/runs
      - httpApi: GET /ops/crawl
      - httpApi: GET /ops/errors
      - httpApi: GET /app
      - httpApi: GET /app/{proxy+}
      - httpApi: POST /internal/email-tokens
      - httpApi: GET /analytics
      - httpApi: GET /auth/config
      - httpApi:
          method: GET
          path: /account
          authorizer: { name: cognito }
      - httpApi:
          method: PUT
          path: /account
          authorizer: { name: cognito }
      - httpApi:
          method: POST
          path: /account/profiles
          authorizer: { name: cognito }
      - httpApi:
          method: POST
          path: /account/profiles/{user_id}/open
          authorizer: { name: cognito }
      # Data reset: a person deletes their own check (dashboard token, checked in the Lambda);
      # an account removes its saved checks; an admin (Cognito group) deletes uploaded users.
      - httpApi: DELETE /me
      - httpApi:
          method: DELETE
          path: /account/profiles
          authorizer: { name: cognito }
      - httpApi:
          method: DELETE
          path: /account/profiles/{user_id}
          authorizer: { name: cognito }
      - httpApi:
          method: DELETE
          path: /uploads
          authorizer: { name: cognito }
      - httpApi:
          method: DELETE
          path: /uploads/{job_id}
          authorizer: { name: cognito }

resources:
  Conditions:
    GoogleSignIn: !Equals ["${self:custom.googleSignIn}", "true"]
  Resources:
    # ------------------------------------------------------------------
    # VPC + Internet Gateway
    # ------------------------------------------------------------------
    Vpc:
      Type: AWS::EC2::VPC
      Properties:
        CidrBlock: 10.0.0.0/16
        EnableDnsSupport: true
        # Required for the Secrets Manager interface endpoint's private DNS;
        # without it, Lambdas silently resolve the public endpoint and time out.
        EnableDnsHostnames: true
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}" }

    InternetGateway:
      Type: AWS::EC2::InternetGateway
      Properties:
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-igw" }

    VpcGatewayAttachment:
      Type: AWS::EC2::VPCGatewayAttachment
      Properties:
        VpcId: !Ref Vpc
        InternetGatewayId: !Ref InternetGateway

    # ------------------------------------------------------------------
    # Subnets: 2 AZs, because an RDS subnet group needs at least two.
    # Public = n8n EC2 (outbound only). Private = RDS + all Lambdas.
    # ------------------------------------------------------------------
    PublicSubnetA:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref Vpc
        CidrBlock: 10.0.0.0/24
        AvailabilityZone: !Select [0, !GetAZs ""]
        # The public IP is for outbound calls (lender sites, Bedrock, SES).
        # Nothing can come in: no security group allows internet traffic.
        MapPublicIpOnLaunch: true
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-public-a" }

    PublicSubnetB:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref Vpc
        CidrBlock: 10.0.1.0/24
        AvailabilityZone: !Select [1, !GetAZs ""]
        MapPublicIpOnLaunch: true
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-public-b" }

    PrivateSubnetA:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref Vpc
        CidrBlock: 10.0.10.0/24
        AvailabilityZone: !Select [0, !GetAZs ""]
        MapPublicIpOnLaunch: false
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-private-a" }

    PrivateSubnetB:
      Type: AWS::EC2::Subnet
      Properties:
        VpcId: !Ref Vpc
        CidrBlock: 10.0.11.0/24
        AvailabilityZone: !Select [1, !GetAZs ""]
        MapPublicIpOnLaunch: false
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-private-b" }

    # ------------------------------------------------------------------
    # Routing
    # ------------------------------------------------------------------
    PublicRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref Vpc
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-public-rt" }

    PublicDefaultRoute:
      Type: AWS::EC2::Route
      # The route can only exist once the gateway is attached; without this
      # the first deploy can fail at random.
      DependsOn: VpcGatewayAttachment
      Properties:
        RouteTableId: !Ref PublicRouteTable
        DestinationCidrBlock: 0.0.0.0/0
        GatewayId: !Ref InternetGateway

    PublicSubnetARouteAssoc:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnetA
        RouteTableId: !Ref PublicRouteTable

    PublicSubnetBRouteAssoc:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PublicSubnetB
        RouteTableId: !Ref PublicRouteTable

    # No 0.0.0.0/0 route on purpose: private subnets have no internet and no NAT.
    # They reach S3 and Secrets Manager through VPC endpoints only.
    PrivateRouteTable:
      Type: AWS::EC2::RouteTable
      Properties:
        VpcId: !Ref Vpc
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-private-rt" }

    PrivateSubnetARouteAssoc:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PrivateSubnetA
        RouteTableId: !Ref PrivateRouteTable

    PrivateSubnetBRouteAssoc:
      Type: AWS::EC2::SubnetRouteTableAssociation
      Properties:
        SubnetId: !Ref PrivateSubnetB
        RouteTableId: !Ref PrivateRouteTable

    # ------------------------------------------------------------------
    # Security groups: rules reference other groups, never IP ranges.
    # ------------------------------------------------------------------
    LambdaSG:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Lambdas - no inbound traffic
        VpcId: !Ref Vpc
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-lambda" }

    N8nSG:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: n8n EC2 - webhook from Lambdas only; no SSH, no internet inbound
        VpcId: !Ref Vpc
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5678
            ToPort: 5678
            SourceSecurityGroupId: !Ref LambdaSG
            Description: ingest Lambda to n8n webhook
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-n8n" }

    RdsSG:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: RDS PostgreSQL - from Lambdas and n8n only
        VpcId: !Ref Vpc
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref LambdaSG
            Description: Lambdas to Postgres
          - IpProtocol: tcp
            FromPort: 5432
            ToPort: 5432
            SourceSecurityGroupId: !Ref N8nSG
            Description: n8n to Postgres (also the SSM tunnel path)
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-rds" }

    EndpointSG:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Interface endpoints - HTTPS from Lambdas and n8n
        VpcId: !Ref Vpc
        # n8n is allowed too: with private DNS on, every host in the VPC
        # (including the EC2) resolves Secrets Manager to this endpoint (PLAN.md §23).
        SecurityGroupIngress:
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourceSecurityGroupId: !Ref LambdaSG
            Description: Lambdas to Secrets Manager
          - IpProtocol: tcp
            FromPort: 443
            ToPort: 443
            SourceSecurityGroupId: !Ref N8nSG
            Description: n8n EC2 to Secrets Manager
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-endpoints" }

    # ------------------------------------------------------------------
    # VPC endpoints: private paths to AWS services instead of a NAT Gateway.
    # ------------------------------------------------------------------
    S3GatewayEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref Vpc
        ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
        VpcEndpointType: Gateway # free
        RouteTableIds:
          - !Ref PrivateRouteTable

    SecretsManagerEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: !Ref Vpc
        ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
        VpcEndpointType: Interface
        PrivateDnsEnabled: true
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        SecurityGroupIds:
          - !Ref EndpointSG

    # ------------------------------------------------------------------
    # RDS PostgreSQL 17: private, encrypted, SSL forced (PG ≥15 default
    # rds.force_ssl=1, verified in ap-southeast-2), password owned by RDS.
    # ------------------------------------------------------------------
    DBSubnetGroup:
      Type: AWS::RDS::DBSubnetGroup
      Properties:
        DBSubnetGroupDescription: Private subnets only - RDS never gets a public address
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB

    Database:
      Type: AWS::RDS::DBInstance
      # Three seatbelts against data loss: a final snapshot on delete or replace,
      # DeletionProtection, and a fixed identifier (a replacement then fails
      # loudly instead of silently creating a new, empty database).
      DeletionPolicy: Snapshot
      UpdateReplacePolicy: Snapshot
      Properties:
        DBInstanceIdentifier: ${self:service}-${sls:stage}
        Engine: postgres
        # 17: n8n 2.x gives PG 16 "compatibility support only" (seen in its logs, 2026-10-09).
        # Upgraded in place from 16.15 (same endpoint, data kept; RDS snapshots before).
        EngineVersion: "17.11"
        AllowMajorVersionUpgrade: true
        AutoMinorVersionUpgrade: false # no surprise maintenance restart during the demo
        DBInstanceClass: db.t4g.micro
        AllocatedStorage: 20
        StorageType: gp3
        StorageEncrypted: true
        DBName: app # engine data; the `n8n` database is created later by the migrate Lambda
        MasterUsername: dbadmin
        ManageMasterUserPassword: true # RDS generates the password and keeps it in Secrets Manager
        DBSubnetGroupName: !Ref DBSubnetGroup
        VPCSecurityGroups:
          - !Ref RdsSG
        PubliclyAccessible: false
        MultiAZ: false # single-AZ for cost; production would use Multi-AZ
        BackupRetentionPeriod: 1
        DeletionProtection: true
        CopyTagsToSnapshot: true

    # ------------------------------------------------------------------
    # Claim-check ingestion: browser -> S3 (presigned POST) -> SQS -> ingest Lambda.
    # The big file never passes through API Gateway or Lambda request limits.
    # ------------------------------------------------------------------
    DataBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain # stateful: a stack change must never delete uploaded data
      UpdateReplacePolicy: Retain
      # S3 sends a test message to the queue when the notification is saved;
      # without the policy in place first, the deploy fails "Unable to validate destination".
      DependsOn: IngestQueuePolicy
      Properties:
        BucketName: ${self:custom.dataBucket}
        # The browser POSTs the file straight to S3, so S3 must allow our API's origin
        # (and only it) to make that cross-origin POST.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [POST]
              AllowedOrigins:
                - !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
              AllowedHeaders: ["*"]
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: expire-raw-uploads # raw PII doesn't linger; the parsed rows live in RDS
              Status: Enabled
              Prefix: raw/
              ExpirationInDays: 7
            - Id: abort-incomplete-multipart
              Status: Enabled
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 1
        NotificationConfiguration:
          QueueConfigurations:
            - Event: s3:ObjectCreated:*
              Queue: !GetAtt IngestQueue.Arn
              Filter:
                S3Key:
                  Rules:
                    - { Name: prefix, Value: raw/ }
                    - { Name: suffix, Value: .csv }

    DataBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref DataBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: DenyInsecureTransport
              Effect: Deny
              Principal: "*"
              Action: s3:*
              Resource:
                - arn:aws:s3:::${self:custom.dataBucket}
                - arn:aws:s3:::${self:custom.dataBucket}/*
              Condition:
                Bool:
                  aws:SecureTransport: "false"

    IngestQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-ingest
        # At least 6x the ingest Lambda timeout (120 s), per AWS guidance for SQS event sources,
        # so a slow attempt is never redelivered while it is still running.
        VisibilityTimeout: 720
        # SSE-SQS, not the AWS-managed KMS key: S3 notifications can't write to a queue
        # encrypted with aws/sqs.
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt IngestDLQ.Arn
          maxReceiveCount: 3

    IngestDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${sls:stage}-ingest-dlq
        MessageRetentionPeriod: 1209600 # 14 days (the maximum), time to investigate
        SqsManagedSseEnabled: true

    # ------------------------------------------------------------------
    # Monitoring: the ingest handler marks a job FAILED and consumes the message on its
    # 3rd attempt, so only HARD crashes (timeout, DB unreachable before the claim) reach the
    # DLQ. Any message there, or any Lambda error, emails the operator (test alias).
    # ------------------------------------------------------------------
    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-${sls:stage}-alarms
        KmsMasterKeyId: alias/aws/sns
        Subscription:
          - Protocol: email
            Endpoint: yashg16422+one@gmail.com # the project's test alias (confirm once)

    IngestDlqNotEmptyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ingest-dlq-not-empty
        AlarmDescription: An upload crashed ingest hard 3 times (timeout or DB unreachable); inspect the DLQ message and its job.
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - { Name: QueueName, Value: !GetAtt IngestDLQ.QueueName }
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    # The consumer removes dead-letter messages, so the queue-depth alarm above may never see
    # one: alarm on the consumer running instead (every run = a crashed upload).
    IngestDlqConsumedAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ingest-dlq-consumed
        AlarmDescription: An upload crashed ingest hard 3 times and was marked FAILED from the DLQ; check its job and the ingest logs.
        Namespace: AWS/Lambda
        MetricName: Invocations
        Dimensions:
          - { Name: FunctionName, Value: !Ref IngestDlqLambdaFunction }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    IngestErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-ingest-errors
        AlarmDescription: The ingest Lambda raised errors (SQS will retry; repeated errors end in the DLQ).
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - { Name: FunctionName, Value: !Ref IngestLambdaFunction }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    ApiErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-${sls:stage}-api-errors
        AlarmDescription: The api Lambda failed 5 or more times in 5 minutes (users see 500s).
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - { Name: FunctionName, Value: !Ref ApiLambdaFunction }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]

    IngestQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref IngestQueue
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowOurBucketOnly
              Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IngestQueue.Arn
              # Confused-deputy guard: only our bucket, in our account, may enqueue.
              Condition:
                ArnLike:
                  aws:SourceArn: arn:aws:s3:::${self:custom.dataBucket}
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId

    # ------------------------------------------------------------------
    # Database role passwords: generated by Secrets Manager, never typed by a human.
    # No automatic rotation (PLAN.md §7); production would add a rotation Lambda.
    # ExcludePunctuation avoids quoting bugs in connection strings and the n8n UI.
    # ------------------------------------------------------------------
    AppIngestDbSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:service}/${sls:stage}/db/app_ingest
        Description: Postgres login for the api and ingest Lambdas
        GenerateSecretString:
          SecretStringTemplate: '{"username": "app_ingest"}'
          GenerateStringKey: password
          PasswordLength: 32
          ExcludePunctuation: true

    N8nWorkflowsDbSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:service}/${sls:stage}/db/n8n_workflows
        Description: Postgres login for the n8n Postgres credential (workflows A, B, C)
        GenerateSecretString:
          SecretStringTemplate: '{"username": "n8n_workflows"}'
          GenerateStringKey: password
          PasswordLength: 32
          ExcludePunctuation: true

    N8nMetaDbSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:service}/${sls:stage}/db/n8n_meta
        Description: Postgres login for n8n's own storage (database n8n)
        GenerateSecretString:
          SecretStringTemplate: '{"username": "n8n_meta"}'
          GenerateStringKey: password
          PasswordLength: 32
          ExcludePunctuation: true

    # n8n's credential-encryption key. Retained even if the stack is deleted: without
    # the same key, n8n can never decrypt the credentials it stored in RDS again.
    N8nEncryptionKeySecret:
      Type: AWS::SecretsManager::Secret
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        Name: ${self:service}/${sls:stage}/n8n/encryption-key
        Description: N8N_ENCRYPTION_KEY for the self-hosted n8n
        GenerateSecretString:
          SecretStringTemplate: "{}"
          GenerateStringKey: key
          PasswordLength: 48
          ExcludePunctuation: true

    # Shared secret between the ingest Lambda and n8n's webhook (Header Auth credential).
    N8nWebhookSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:service}/${sls:stage}/n8n/webhook-token
        Description: X-Webhook-Secret header value for the ingest-complete webhook
        GenerateSecretString:
          PasswordLength: 48
          ExcludePunctuation: true

    # ------------------------------------------------------------------
    # Borrower accounts: Amazon Cognito owns identity (passwords never reach our code or
    # database). COGNITO_DEFAULT email delivers verification codes to ANY address, which
    # our own SES cannot while it is in the sandbox.
    # ------------------------------------------------------------------
    UserPool:
      Type: AWS::Cognito::UserPool
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        UserPoolName: ${self:service}-${sls:stage}-users
        DeletionProtection: ACTIVE
        UsernameAttributes: [email]
        UsernameConfiguration:
          CaseSensitive: false
        AutoVerifiedAttributes: [email]
        AccountRecoverySetting:
          RecoveryMechanisms:
            - { Name: verified_email, Priority: 1 }
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        Policies:
          PasswordPolicy:
            MinimumLength: 10
            RequireLowercase: true
            RequireNumbers: true
            RequireUppercase: false
            RequireSymbols: false
            TemporaryPasswordValidityDays: 3
        VerificationMessageTemplate:
          DefaultEmailOption: CONFIRM_WITH_CODE
          EmailSubject: Your ClickPar Match code
          EmailMessage: "Your ClickPar Match verification code is {####}. If you did not ask for it, ignore this email."

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        ClientName: ${self:service}-${sls:stage}-web
        GenerateSecret: false # a browser app cannot keep a secret (the OAuth flow uses PKCE)
        ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        PreventUserExistenceErrors: ENABLED # sign-in errors never reveal whether an email exists
        EnableTokenRevocation: true
        IdTokenValidity: 1
        AccessTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          IdToken: hours
          AccessToken: hours
          RefreshToken: days
        # OAuth 2.0 authorization-code flow with PKCE, for "Continue with Google".
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [openid, email, profile]
        SupportedIdentityProviders: !If [GoogleSignIn, [COGNITO, !Ref GoogleIdentityProvider], [COGNITO]]
        CallbackURLs:
          - !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/app/auth/callback
          - http://localhost:5173/app/auth/callback
        LogoutURLs:
          - !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/app/merchant
          - http://localhost:5173/app/merchant

    UserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: !Ref UserPool
        Domain: ${self:custom.authDomain}
        # Managed login (not the classic hosted UI): it forwards prompt=select_account to Google,
        # so people with several Google accounts choose one. In-place update (no replacement).
        ManagedLoginVersion: 2

    # Managed login needs a style per app client; a client made by CloudFormation has none.
    # Cognito's default style: the app never shows these pages (Google sign-in goes straight
    # to Google, email sign-in uses the Cognito API from the app's own form).
    ManagedLoginBranding:
      Type: AWS::Cognito::ManagedLoginBranding
      DependsOn: UserPoolDomain
      Properties:
        UserPoolId: !Ref UserPool
        ClientId: !Ref UserPoolClient
        UseCognitoProvidedValues: true

    # Google as an identity provider. The client secret is a Secrets Manager dynamic reference:
    # resolved by CloudFormation at deploy time, never in the repo or the template.
    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: GoogleSignIn
      Properties:
        UserPoolId: !Ref UserPool
        ProviderName: Google
        ProviderType: Google
        ProviderDetails:
          client_id: "{{resolve:secretsmanager:loan-engine/${sls:stage}/google-oauth:SecretString:client_id}}"
          client_secret: "{{resolve:secretsmanager:loan-engine/${sls:stage}/google-oauth:SecretString:client_secret}}"
          authorize_scopes: openid email profile
        AttributeMapping:
          email: email
          email_verified: email_verified # the API only accepts verified emails
          name: name

    # Members may delete uploaded data from the app (DELETE /uploads). Membership is granted
    # by hand, never by sign-up: aws cognito-idp admin-add-user-to-group (README §14).
    AdminGroup:
      Type: AWS::Cognito::UserPoolGroup
      Properties:
        UserPoolId: !Ref UserPool
        GroupName: admin
        Description: Can delete uploaded users from the app (data reset)

    # HMAC key for the borrower dashboard's signed links (no accounts, no passwords).
    DashboardTokenSecret:
      Type: AWS::SecretsManager::Secret
      Properties:
        Name: ${self:service}/${sls:stage}/dashboard/token-key
        Description: HMAC-SHA256 key that signs borrower dashboard tokens
        GenerateSecretString:
          PasswordLength: 64
          ExcludePunctuation: true

    # ------------------------------------------------------------------
    # n8n host: EC2 in a public subnet for OUTBOUND traffic only (no inbound from the
    # internet, no SSH). Reached via SSM Session Manager port forwarding.
    # ------------------------------------------------------------------
    N8nInstanceRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: ec2.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore # SSM tunnel + Run Command
        Policies:
          - PolicyName: n8n-host
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: BootSecretsOnly
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !Ref N8nMetaDbSecret
                    - !Ref N8nEncryptionKeySecret
                - Sid: ConfigAndFixturesOnly
                  Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - arn:aws:s3:::${self:custom.dataBucket}/config/*
                    - arn:aws:s3:::${self:custom.dataBucket}/fixtures/*
                - Sid: ListConfigAndFixturesOnly # `aws s3 sync` needs to list; prefixes only
                  Effect: Allow
                  Action: s3:ListBucket
                  Resource: arn:aws:s3:::${self:custom.dataBucket}
                  Condition:
                    StringLike:
                      s3:prefix:
                        - config/*
                        - fixtures/*
                - Sid: BecomeTheN8nAwsRole # used by n8n's "AWS (Assume Role)" credential
                  Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !GetAtt N8nAwsRole.Arn

    # What n8n workflows may do in AWS: send email and call Nova Pro. Nothing else.
    N8nAwsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-n8n-aws
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
              Action: sts:AssumeRole
              # Only the n8n instance role may assume it (checked by ARN pattern, which
              # avoids a circular reference between the two roles).
              Condition:
                ArnLike:
                  aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${self:service}-${sls:stage}-N8nInstanceRole-*
                # n8n's "AWS (Assume Role)" credential requires an External ID; we require
                # it here too (an identifier per AWS docs, not a secret).
                StringEquals:
                  sts:ExternalId: ${self:service}-${sls:stage}-n8n
        Policies:
          - PolicyName: ses-and-bedrock
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: SendEmail # SES sandbox: verified identities only (our +aliases)
                  Effect: Allow
                  Action:
                    - ses:SendEmail
                    - ses:SendRawEmail
                  Resource: !Sub arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
                - Sid: NovaProOnly
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.nova-pro-v1:0
                - Sid: ReadCrawlerFixturesOnly # Workflow A's fallback when a live fetch fails
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: arn:aws:s3:::${self:custom.dataBucket}/fixtures/*

    N8nInstanceProfile:
      Type: AWS::IAM::InstanceProfile
      Properties:
        Roles:
          - !Ref N8nInstanceRole

    N8nInstance:
      Type: AWS::EC2::Instance
      Properties:
        # Pinned AMI (AL2023 arm64, 2026-09-29). Resolving "latest" from SSM would let a
        # future deploy swap the AMI, replacing the instance and changing its private IP.
        ImageId: ami-05dbf6439e0906761
        InstanceType: t4g.small
        SubnetId: !Ref PublicSubnetA
        SecurityGroupIds:
          - !Ref N8nSG
        IamInstanceProfile: !Ref N8nInstanceProfile
        MetadataOptions:
          HttpTokens: required # IMDSv2 only
          # 2 hops so the n8n *container* (behind Docker's bridge) can reach the instance role.
          HttpPutResponseHopLimit: 2
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              Encrypted: true
        Tags:
          - { Key: Name, Value: "${self:service}-${sls:stage}-n8n" }
        # No secrets here: only names and ARNs. boot.sh reads secrets via the instance role.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            mkdir -p /etc/n8n
            cat > /etc/n8n/boot.env <<'ENV'
            BUCKET=${self:custom.dataBucket}
            REGION=${AWS::Region}
            DB_HOST=${Database.Endpoint.Address}
            META_SECRET_ARN=${N8nMetaDbSecret}
            ENC_KEY_SECRET_ARN=${N8nEncryptionKeySecret}
            ENV
            # Wait for scripts/n8n-sync.sh push to have uploaded the boot script.
            until aws s3 cp --region ${AWS::Region} s3://${self:custom.dataBucket}/config/boot.sh /root/n8n-boot.sh; do sleep 15; done
            bash /root/n8n-boot.sh

    # ------------------------------------------------------------------
    # IAM: one role per function, scoped to exact ARNs (least privilege).
    # ------------------------------------------------------------------
    MigrateRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          # CloudWatch Logs + the ENI permissions a VPC Lambda needs.
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        Policies:
          - PolicyName: read-db-secrets
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !GetAtt Database.MasterUserSecret.SecretArn
                    - !Ref AppIngestDbSecret
                    - !Ref N8nWorkflowsDbSecret
                    - !Ref N8nMetaDbSecret

    IngestRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        Policies:
          - PolicyName: ingest
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: ReadUploadedCsvsOnly
                  Effect: Allow
                  Action: s3:GetObject
                  Resource: arn:aws:s3:::${self:custom.dataBucket}/raw/*
                - Sid: OwnSecretsOnly # its DB login + the webhook header secret
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !Ref AppIngestDbSecret
                    - !Ref N8nWebhookSecret
                - Sid: ConsumeIngestQueue # used by the Lambda event source mapping
                  Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ChangeMessageVisibility
                  Resource: !GetAtt IngestQueue.Arn

    IngestDlqRole: # its DB login and the dead-letter queue, nothing else
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        Policies:
          - PolicyName: ingest-dlq
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: OwnDbSecretOnly
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref AppIngestDbSecret
                - Sid: ConsumeDeadLetterQueue
                  Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ChangeMessageVisibility
                  Resource: !GetAtt IngestDLQ.Arn

    ApiRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        Policies:
          - PolicyName: api
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                # A presigned POST acts with the signer's permissions, so the role
                # needs PutObject, but only under raw/ (and the policy pins the key).
                - Sid: SignUploadsUnderRawOnly
                  Effect: Allow
                  Action: s3:PutObject
                  Resource: arn:aws:s3:::${self:custom.dataBucket}/raw/*
                - Sid: OwnDbSecretOnly
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !Ref AppIngestDbSecret
                    - !Ref DashboardTokenSecret
                    - !Ref N8nWebhookSecret

  # Merge throttling into the HTTP API stage that Serverless generates:
  # the only public surface gets a rate limit (PLAN.md §4.3).
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: 10
          ThrottlingBurstLimit: 20

  Outputs:
    N8nInstanceId:
      Value: !Ref N8nInstance
    N8nPrivateIp:
      Value: !GetAtt N8nInstance.PrivateIp
    N8nAwsRoleArn:
      Value: !GetAtt N8nAwsRole.Arn
    N8nAwsRoleExternalId:
      Value: ${self:service}-${sls:stage}-n8n
    UserPoolId:
      Value: !Ref UserPool
    UserPoolClientId:
      Value: !Ref UserPoolClient
    UploadUiUrl:
      Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/
    DataBucketName:
      Value: !Ref DataBucket
    IngestQueueUrl:
      Value: !Ref IngestQueue
    IngestDLQUrl:
      Value: !Ref IngestDLQ
    DbEndpoint:
      Value: !GetAtt Database.Endpoint.Address
    DbMasterSecretArn:
      Value: !GetAtt Database.MasterUserSecret.SecretArn
    VpcId:
      Value: !Ref Vpc
    PrivateSubnetIds:
      Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    PublicSubnetIds:
      Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    LambdaSGId:
      Value: !Ref LambdaSG
    N8nSGId:
      Value: !Ref N8nSG
    RdsSGId:
      Value: !Ref RdsSG
